name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: wishpage/package-lock.json

      - name: Install dependencies
        working-directory: wishpage
        run: npm ci

      - name: Build Next.js static export
        working-directory: wishpage
        run: npm run build

      - name: Assemble site
        run: |
          mkdir -p _site
          # Copy root site files (index.html, CNAME, etc.)
          cp -r index.html CNAME README.md _site/ 2>/dev/null || true
          # Copy existing subdirectories
          [ -d teja ] && cp -r teja _site/
          [ -d govprep ] && cp -r govprep _site/
          # Copy Next.js static export as /wishpage
          cp -r wishpage/out _site/wishpage

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
